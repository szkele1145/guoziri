// 过日子 · 应用模块构建配置
// Chaquopy 17 新 DSL：全部配置在顶层 chaquopy 块（旧 defaultConfig 内嵌写法已废弃）
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.guoziri.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.guoziri.app"
        minSdk 24          // Android 7.0
        targetSdk 34
        versionCode 1
        versionName "0.1"

        ndk {
            // Python 3.12 只有 arm64-v8a / x86_64 两个 ABI（Chaquopy 15 起不再支持 32 位 ARM）
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            // Python 源码：backend/ 原样进 APK
            python.srcDir "../../backend"
            // 前端：web/ 进 assets，启动时解压给 Flask
            assets.srcDirs += "../../web"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        // Chaquopy 17 要求 buildPython 与 app Python 同主次版本；CI 已装 3.12
        buildPython "python3.12"
        pip {
            install "flask==3.0.3"
            install "werkzeug==3.0.3"
            install "requests==2.31.0"
            install "urllib3==2.2.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // webkit 1.11 传递依赖 kotlin-stdlib-jdk8 1.6/1.8 与新 stdlib 重复，强制对齐
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib 1.8+ 已合并 jdk8 类，避免 Duplicate class'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because '同上'
        }
    }
}
