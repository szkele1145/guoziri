// guoziri app module build config
// Chaquopy 17 DSL: all settings live in the top-level chaquopy block
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.guoziri.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.guoziri.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"

        ndk {
            // Python 3.12 supports arm64-v8a / x86_64 only
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            // backend/ python sources go into the APK as-is
            python.srcDir "../../backend"
            // web/ frontend goes into assets, unpacked for Flask at startup
            assets.srcDirs += "../../web"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signing material injected by CI (-PksFile / -PksPassword)
            def ksFile = project.findProperty("ksFile")
            def ksPass = project.findProperty("ksPassword")
            if (ksFile && ksPass && rootProject.file(ksFile).exists()) {
                signingConfig signingConfigs.create("release")
                signingConfigs.release.storeFile rootProject.file(ksFile)
                signingConfigs.release.storePassword ksPass
                signingConfigs.release.keyAlias "guoziri"
                signingConfigs.release.keyPassword ksPass
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        // buildPython must match app python major.minor; CI installs 3.12
        buildPython "python3.12"
        pip {
            install "flask==3.0.3"
            install "werkzeug==3.0.3"
            install "requests==2.31.0"
            install "urllib3==2.2.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib 1.8+ merged jdk8 classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'same as above'
        }
    }
}
