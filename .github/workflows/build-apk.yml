name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 需要 buildPython 与 app 内 Python 同为 3.12
      # （CI 默认 python 是 3.10/3.12 视 runner 而定，显式锁定最稳）
      - name: Set up Python 3.12 (buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # 关键：用项目自带 wrapper（Gradle 8.7），不能用 runner 自带的 9.x
          # 否则 Chaquopy 15 会因 org.gradle.util.VersionNumber 被移除而崩
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guoziri-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
