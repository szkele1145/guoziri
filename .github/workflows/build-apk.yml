name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道：stable=正式版 / test=测试版'
        required: true
        default: 'stable'
        type: choice
        options: [stable, test]
      testBuildNo:
        description: '测试版构建号（仅 test 通道有效）'
        required: false
        default: '1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 需要 buildPython 与 app 内 Python 同为 3.12
      - name: Set up Python 3.12 (buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # release 签名：keystore/密码走 Secrets，base64 保真传输
      - name: Decode keystore
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -z "$KS_BASE64" ]; then echo "::warning::未配置 KS_BASE64，本次出 debug 包"; exit 0; fi
          echo "$KS_BASE64" | base64 -d > android-native/guoziri.keystore
          echo "KS_FILE=android-native/guoziri.keystore" >> $GITHUB_ENV

      # 通道判定：workflow_dispatch 手动触发时用输入值，push 触发默认 stable
      - name: Resolve channel
        id: ch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            TEST_NO="${{ inputs.testBuildNo }}"
          else
            CHANNEL="stable"
            TEST_NO="1"
          fi
          if [ "$CHANNEL" = "test" ]; then
            echo "channel=test" >> $GITHUB_OUTPUT
            echo "versionName=1.3.0-test${TEST_NO}" >> $GITHUB_OUTPUT
            echo "tag=test" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "versionName=1.3" >> $GITHUB_OUTPUT
            echo "tag=releases" >> $GITHUB_OUTPUT
          fi
          echo ">>> 通道: $CHANNEL  版本: $(cat /dev/null)" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android-native
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          CHANNEL: ${{ steps.ch.outputs.channel }}
          TEST_NO: ${{ steps.ch.outputs.testBuildNo }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_PASSWORD" ] && [ -f guoziri.keystore ]; then
            echo ">>> 有签名材料，构建 release 包（通道 $CHANNEL）"
            ./gradlew assembleRelease \
              -PksFile=guoziri.keystore -PksPassword="$KS_PASSWORD" \
              -Pchannel="$CHANNEL" -PtestBuildNo="${TEST_NO:-1}" \
              --no-daemon --stacktrace
          else
            echo ">>> 无签名材料，构建 debug 包（通道 $CHANNEL）"
            ./gradlew assembleDebug \
              -Pchannel="$CHANNEL" -PtestBuildNo="${TEST_NO:-1}" \
              --no-daemon --stacktrace
          fi

      - name: Collect APK
        working-directory: android-native
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guoziri-apk-${{ steps.ch.outputs.channel }}
          path: android-native/out/*.apk
          if-no-files-found: error
