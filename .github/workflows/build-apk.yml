name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 需要 buildPython 与 app 内 Python 同为 3.12
      - name: Set up Python 3.12 (buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # release 签名：keystore/密码走 Secrets，base64 保真传输
      - name: Decode keystore
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -z "$KS_BASE64" ]; then echo "::warning::未配置 KS_BASE64，本次出 debug 包"; exit 0; fi
          echo "$KS_BASE64" | base64 -d > android-native/guoziri.keystore
          echo "KS_FILE=android-native/guoziri.keystore" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android-native
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_PASSWORD" ] && [ -f guoziri.keystore ]; then
            echo ">>> 有签名材料，构建 release 包"
            ./gradlew assembleRelease \
              -PksFile=guoziri.keystore -PksPassword="$KS_PASSWORD" \
              --no-daemon --stacktrace
          else
            echo ">>> 无签名材料，构建 debug 包"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        working-directory: android-native
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guoziri-apk
          path: android-native/out/*.apk
          if-no-files-found: error
