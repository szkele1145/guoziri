plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.guoziri.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.guoziri.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksFile = project.findProperty("ksFile")
            def ksPass = project.findProperty("ksPassword")
            if (ksFile && ksPass && rootProject.file(ksFile).exists()) {
                signingConfig signingConfigs.create("release")
                signingConfigs.release.storeFile rootProject.file(ksFile)
                signingConfigs.release.storePassword ksPass
                signingConfigs.release.keyAlias "guoziri"
                signingConfigs.release.keyPassword ksPass
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
