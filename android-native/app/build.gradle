plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def ksFileProp = project.findProperty("ksFile")
def ksPassProp = project.findProperty("ksPassword")

// 渠道版本：正式版走 releases，测试版走 test
// CI 通过 -Pchannel=stable|test 传入；默认 stable
def channelProp = (project.findProperty("channel") ?: "stable").toString()
def isTest = channelProp == "test"
// 正式版：1.3.5 / 1.3.6 ...；测试版：1.3.5-test1 ...
def baseVersion = "1.3.8"
def testBuildNo = (project.findProperty("testBuildNo") ?: "1").toString()
def versionCodeVal = isTest ? (500 + (testBuildNo.toInteger())) : 13
def versionNameVal = isTest ? "${baseVersion}-test${testBuildNo}" : baseVersion
def versionNameSuffix = isTest ? "-test" : ""

android {
    namespace 'com.guoziri.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.guoziri.app"
        minSdk 26
        targetSdk 35
        versionCode versionCodeVal
        versionName versionNameVal
    }

    signingConfigs {
        if (ksFileProp && ksPassProp && rootProject.file(ksFileProp).exists()) {
            release {
                storeFile rootProject.file(ksFileProp)
                storePassword ksPassProp
                keyAlias "guoziri"
                keyPassword ksPassProp
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFileProp && ksPassProp && rootProject.file(ksFileProp).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}


